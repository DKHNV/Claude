name: DNS maintenance v1 migration

on:
  workflow_dispatch:
    inputs:
      apply_migration:
        description: "Write Claude DNS-Maintenance state and apply public IPv4 guard"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dns-maintenance-claude-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.apply_migration }}
    uses: DKHNV/DNS-Maintenance/.github/workflows/reusable-maintenance.yml@d2b7dffa3e79269e6f63ffb243ebf2abbfeae3eb
    with:
      config_path: dns-maintenance-v1.json
      collection: claude
      dry_run: false
      engine_ref: d2b7dffa3e79269e6f63ffb243ebf2abbfeae3eb
